<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const VERTEX_SHADER = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const SIM_SHADER = `
precision highp float;
uniform sampler2D u_state;
uniform sampler2D u_kernel;
uniform float u_gridWidth;
uniform float u_gridHeight;
uniform vec3 u_mouse;
uniform float u_time;
uniform float u_kernelNorm;

const float R = 15.0;
const float DT = 0.05;
const float KERNEL_SIZE = 31.0;
const float BASE_MU_G = 0.11;
const float BASE_SIGMA_G = 0.0135;

void main() {
  vec2 gridSize = vec2(u_gridWidth, u_gridHeight);
  vec2 cell = floor(gl_FragCoord.xy);
  float sum = 0.0;
  for (float dy = -R; dy <= R; dy += 1.0) {
    for (float dx = -R; dx <= R; dx += 1.0) {
      vec2 kUV = (vec2(dx, dy) + R + 0.5) / KERNEL_SIZE;
      float k = texture2D(u_kernel, kUV).r;
      if (k == 0.0) continue;
      vec2 nc = mod(cell + vec2(dx, dy), gridSize);
      sum += k * texture2D(u_state, (nc + 0.5) / gridSize).r;
    }
  }

  float MU_G = BASE_MU_G + 0.06 * abs(sin(u_time * 0.15));
  float SIGMA_G = BASE_SIGMA_G;

  float u = sum / u_kernelNorm;
  float g = 2.0 * exp(-(u - MU_G) * (u - MU_G) / (2.0 * SIGMA_G * SIGMA_G)) - 1.0;

  vec2 selfUV = (cell + 0.5) / gridSize;
  float current = texture2D(u_state, selfUV).r;
  float occ = texture2D(u_state, selfUV).g;
  float next = clamp(current + DT * g, 0.0, 1.0);

  // Mouse: inject normally-distributed life on hover
  float mDist = length(mod(cell - u_mouse.xy + gridSize * 0.5, gridSize) - gridSize * 0.5);
  float mH1 = fract(sin(dot(cell, vec2(37.1, 159.7)) + u_time * 53.4) * 43758.5453);
  float mH2 = fract(sin(dot(cell, vec2(91.3, 247.9)) + u_time * 71.2) * 43758.5453);
  float mNoise = sqrt(-2.0 * log(max(mH1, 1e-6))) * cos(6.2831853 * mH2); // Box-Muller
  float mFalloff = exp(-mDist * mDist / 200.0);
  next = clamp(next + u_mouse.z * mFalloff * mNoise * 0.4, 0.0, 1.0);

  float newOcc = mix(occ, next, 0.03);
  gl_FragColor = vec4(next, newOcc, 0.0, 1.0);
}
`;

const DISPLAY_SHADER = `
precision highp float;
uniform vec2 u_resolution;
uniform float u_gridWidth;
uniform float u_gridHeight;
uniform float u_scrollCells;
uniform sampler2D u_state;
uniform vec3 u_colorCur;
uniform vec3 u_colorOcc;

void main() {
  float cellPx = u_resolution.x / u_gridWidth;
  vec2 cellCoord = gl_FragCoord.xy / cellPx;
  vec2 cell = floor(cellCoord);
  vec2 f = fract(cellCoord) - 0.5;
  float dist = max(abs(f.x), abs(f.y));

  vec2 scrolledCell = vec2(cell.x, mod(cell.y + u_scrollCells, u_gridHeight));
  vec2 uv = (scrolledCell + 0.5) / vec2(u_gridWidth, u_gridHeight);
  vec4 s = texture2D(u_state, uv);
  float cur = smoothstep(0.05, 0.9, s.r);
  float occ = smoothstep(0.05, 0.9, s.g);
  vec3 color = cur * u_colorCur + occ * u_colorOcc;
  gl_FragColor = vec4(color, 1.0);
}
`;

// --- Parameters ---
const CELL_SIZE = 4;
const CANVAS_ID = 'c';

const COLOR_OCC = '#c8a8f0';
const COLOR_CUR = '#6040a8';

const TEMPORAL_BLEND = 0.0;

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}

const canvas = document.getElementById(CANVAS_ID);
const gl = canvas.getContext('webgl', { antialias: false });

const floatExt = gl.getExtension('OES_texture_float');
if (!floatExt) throw new Error('OES_texture_float not supported');
gl.getExtension('WEBGL_color_buffer_float');

const dpr = devicePixelRatio || 1;
canvas.width = canvas.clientWidth * dpr;
canvas.height = canvas.clientHeight * dpr;
const GRID_WIDTH = Math.round(canvas.clientWidth / CELL_SIZE);
const GRID_HEIGHT = Math.round(canvas.clientHeight / CELL_SIZE);

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function createProg(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vsSrc, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fsSrc, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  return p;
}

const BLEND_SHADER = `
  precision mediump float;
  uniform sampler2D u_cur;
  uniform sampler2D u_prev;
  uniform float u_blend;
  uniform vec2 u_gridSize;
  void main() {
    vec2 uv = gl_FragCoord.xy / u_gridSize;
    vec4 cur  = texture2D(u_cur,  uv);
    vec4 prev = texture2D(u_prev, uv);
    gl_FragColor = mix(cur, prev, u_blend);
  }
`;

const simProg   = createProg(VERTEX_SHADER, SIM_SHADER);
const dispProg  = createProg(VERTEX_SHADER, DISPLAY_SHADER);
const blendProg = createProg(VERTEX_SHADER, BLEND_SHADER);

const sim = {
  state: gl.getUniformLocation(simProg, 'u_state'),
  kernel: gl.getUniformLocation(simProg, 'u_kernel'),
  kernelNorm: gl.getUniformLocation(simProg, 'u_kernelNorm'),
  gridWidth: gl.getUniformLocation(simProg, 'u_gridWidth'),
  gridHeight: gl.getUniformLocation(simProg, 'u_gridHeight'),
  mouse: gl.getUniformLocation(simProg, 'u_mouse'),
  time: gl.getUniformLocation(simProg, 'u_time'),
  pos: gl.getAttribLocation(simProg, 'a_pos'),
};
const disp = {
  state: gl.getUniformLocation(dispProg, 'u_state'),
  resolution: gl.getUniformLocation(dispProg, 'u_resolution'),
  gridWidth: gl.getUniformLocation(dispProg, 'u_gridWidth'),
  gridHeight: gl.getUniformLocation(dispProg, 'u_gridHeight'),
  scrollCells: gl.getUniformLocation(dispProg, 'u_scrollCells'),
  colorCur: gl.getUniformLocation(dispProg, 'u_colorCur'),
  colorOcc: gl.getUniformLocation(dispProg, 'u_colorOcc'),
  pos: gl.getAttribLocation(dispProg, 'a_pos'),
};
const blend = {
  cur:      gl.getUniformLocation(blendProg, 'u_cur'),
  prev:     gl.getUniformLocation(blendProg, 'u_prev'),
  blendAmt: gl.getUniformLocation(blendProg, 'u_blend'),
  gridSize: gl.getUniformLocation(blendProg, 'u_gridSize'),
  pos:      gl.getAttribLocation(blendProg, 'a_pos'),
};

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

function createTex(data) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GRID_WIDTH, GRID_HEIGHT, 0, gl.RGBA, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

function createFBO(tex) {
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    throw new Error('Float FBO not supported');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return fbo;
}

let kernelNorm = 0;

function createKernelTexture() {
  const size = 31;
  const R = 15.0;
  const MU_K = 0.5;
  const SIGMA_K = 0.13;
  const data = new Float32Array(size * size * 4);
  kernelNorm = 0;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = x - R;
      const dy = y - R;
      const r = Math.max(Math.abs(dx), Math.abs(dy)) / R;
      let k = 0;
      if (r <= 1.0) {
        k = Math.exp(-(r - MU_K) * (r - MU_K) / (2.0 * SIGMA_K * SIGMA_K));
        kernelNorm += k;
      }
      const i = (y * size + x) * 4;
      data[i] = k;
    }
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

function initState() {
  const data = new Float32Array(GRID_WIDTH * GRID_HEIGHT * 4);
  for (let i = 0; i < GRID_WIDTH * GRID_HEIGHT; i++) {
    data[i * 4] = Math.random();
  }
  return data;
}

const texA = createTex(initState());
const texB = createTex(null);
const fboA = createFBO(texA);
const fboB = createFBO(texB);
const kernelTex = createKernelTexture();
let ping = 0;

const texSmoothA = createTex(null);
const texSmoothB = createTex(null);
const fbSmoothA  = createFBO(texSmoothA);
const fbSmoothB  = createFBO(texSmoothB);
let smoothPing = 0;

function draw(aPos) {
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

const SIM_STEPS_PER_FRAME = 2;

(function loop(t) {
  gl.useProgram(simProg);
  gl.viewport(0, 0, GRID_WIDTH, GRID_HEIGHT);
  gl.uniform1f(sim.gridWidth, GRID_WIDTH);
  gl.uniform1f(sim.gridHeight, GRID_HEIGHT);
  gl.uniform1f(sim.time, t * 0.003);
  gl.uniform3f(sim.mouse, 0, 0, 0);
  gl.uniform1f(sim.kernelNorm, kernelNorm);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, kernelTex);
  gl.uniform1i(sim.kernel, 1);

  for (let i = 0; i < SIM_STEPS_PER_FRAME; i++) {
    const readTex = ping === 0 ? texA : texB;
    const writeFbo = ping === 0 ? fboB : fboA;
    gl.bindFramebuffer(gl.FRAMEBUFFER, writeFbo);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, readTex);
    gl.uniform1i(sim.state, 0);
    draw(sim.pos);
    ping = 1 - ping;
  }

  const simTex      = ping === 0 ? texA : texB;
  const readSmooth  = smoothPing === 0 ? texSmoothA : texSmoothB;
  const writeSmooth = smoothPing === 0 ? fbSmoothB  : fbSmoothA;
  const dispSmooth  = smoothPing === 0 ? texSmoothB : texSmoothA;
  gl.useProgram(blendProg);
  gl.viewport(0, 0, GRID_WIDTH, GRID_HEIGHT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, writeSmooth);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, simTex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, readSmooth);
  gl.uniform1i(blend.cur, 0);
  gl.uniform1i(blend.prev, 1);
  gl.uniform1f(blend.blendAmt, TEMPORAL_BLEND);
  gl.uniform2f(blend.gridSize, GRID_WIDTH, GRID_HEIGHT);
  draw(blend.pos);
  smoothPing = 1 - smoothPing;

  gl.useProgram(dispProg);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dispSmooth);
  gl.uniform1i(disp.state, 0);
  gl.uniform2f(disp.resolution, canvas.width, canvas.height);
  gl.uniform1f(disp.gridWidth, GRID_WIDTH);
  gl.uniform1f(disp.gridHeight, GRID_HEIGHT);
  gl.uniform1f(disp.scrollCells, 0.0);
  gl.uniform3fv(disp.colorCur, hexToRgb(COLOR_CUR));
  gl.uniform3fv(disp.colorOcc, hexToRgb(COLOR_OCC));
  draw(disp.pos);

  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
